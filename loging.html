<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XARM Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #1a1a1a;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
        }

        h2 {
            margin-bottom: 20px;
            color: #ff9800;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            outline: none;
            background: #222;
            color: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: #111;
            border: none;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            color: #fff;
        }

        .google {
            background: #db4437;
        }

        .facebook {
            background: #1877f2;
        }

        p {
            margin-top: 20px;
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>XARM LOGIN</h2>

        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />

        <button class="login-btn" onclick="login()">Login</button>

        <button class="social-btn google" onclick="login()">Login with Google</button>
        <button class="social-btn facebook" onclick="login()">Login with Facebook</button>

        <p>Welcome to XARM Shopping</p>
    </div>

    <script>
        function login() {
            // For now simple redirect
            window.location.href = "home.html";
        }
    </script>

</body>
</html>
